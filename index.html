<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="計算機">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>計算機</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; }
  html, body { height: 100%; background: #000; overflow: hidden;
      overscroll-behavior: none; touch-action: manipulation; }
  body {
    font-family: -apple-system, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #fff; display: flex; justify-content: center;
  }
  .calc {
    --side: 3.6vw;
    --gap: 1.9vw;
    width: 100%; max-width: 460px; height: 100%;
    display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 2.2vh) calc(var(--side) + env(safe-area-inset-right))
             calc(max(env(safe-area-inset-bottom), 12px) + 3.5vh)
             calc(var(--side) + env(safe-area-inset-left));
  }
  @media (min-width: 460px) { .calc { --side: 16px; --gap: 9px; } }

  /* 上方兩顆圓鈕 */
  .topbar { display: flex; justify-content: space-between; padding: 0 1vw; }
  .round {
    width: 10.5vw; height: 10.5vw; max-width: 50px; max-height: 50px; min-width: 42px; min-height: 42px;
    border-radius: 50%; border: none; outline: none; cursor: pointer;
    background: linear-gradient(180deg, #2a2a2a, #1c1c1c);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.14), inset 0 0 0 1px rgba(255,255,255,.06);
    display: flex; align-items: center; justify-content: center; color: #fff;
    transition: background .3s;
  }
  .round svg { width: 48%; height: 48%; }
  .round.pressed { background: #444; transition: none; }

  /* 顯示區 */
  .display {
    flex: 1; display: flex; flex-direction: column; align-items: flex-end; justify-content: flex-end;
    padding: 0 3vw 1.6vh; overflow: hidden; min-height: 110px;
  }
  .line { white-space: nowrap; transform-origin: right bottom; font-variant-numeric: tabular-nums; }
  #expr { font-size: 30px; color: #8e8e93; font-weight: 400; min-height: 36px; letter-spacing: 0; }
  #result { font-size: 84px; font-weight: 400; line-height: 1.05; letter-spacing: -0.5px; }

  /* 按鍵 */
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap) calc(var(--gap) * 1.1); }
  .key {
    aspect-ratio: 1.075 / 1; border-radius: 999px; border: none; outline: none; cursor: pointer;
    font-family: inherit; color: #fff; font-size: 36px; font-weight: 400;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #3a3a3a 0%, #313131 100%);
    box-shadow: inset 0 1px 0.5px rgba(255,255,255,.16), inset 0 -1px 1px rgba(0,0,0,.25), inset 0 0 0 0.5px rgba(255,255,255,.07);
    transition: background .4s ease, filter .4s ease;
  }
  .key.fn { background: linear-gradient(180deg, #686868 0%, #5c5c5c 100%); font-size: 34px; }
  .key.op { background: linear-gradient(180deg, #f5a13e 0%, #ef9a35 100%);
            box-shadow: inset 0 1px 0.5px rgba(255,255,255,.35), inset 0 -1px 1px rgba(0,0,0,.12); }
  .key svg { width: 34%; height: 34%; display: block; overflow: visible; }
  .key.fn svg { width: 36%; height: 36%; }
  .key.pressed { filter: brightness(1.55); transition: none; }
  .key.op.pressed { filter: brightness(1.25); }

  /* 歷史紀錄 */
  #history {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none;
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); z-index: 10;
  }
  #history.open { display: block; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; max-height: 78%;
    background: #1c1c1e; border-radius: 22px 22px 0 0; display: flex; flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .sheet header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; font-size: 17px; font-weight: 600; }
  .sheet header button { background: none; border: none; color: #ff9f0a; font-size: 17px; font-family: inherit; cursor: pointer; }
  #histList { overflow-y: auto; padding: 0 20px 20px; -webkit-user-select: none; }
  .hitem { text-align: right; padding: 12px 0; border-bottom: 0.5px solid #38383a; cursor: pointer; }
  .hitem .e { color: #8e8e93; font-size: 17px; }
  .hitem .r { font-size: 28px; }
  .empty { color: #8e8e93; text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<div class="calc">
  <div class="topbar">
    <button class="round" id="histBtn" aria-label="歷史紀錄">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 6.5V12H7.5"/></svg>
    </button>
    <button class="round" id="modeBtn" aria-label="計算機">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="2" width="14" height="20" rx="2.6" fill="none" stroke="currentColor" stroke-width="1.9"/><rect x="7.6" y="4.8" width="8.8" height="3.6" rx=".8"/><g><circle cx="8.6" cy="11.4" r="1.05"/><circle cx="12" cy="11.4" r="1.05"/><circle cx="15.4" cy="11.4" r="1.05"/><circle cx="8.6" cy="14.6" r="1.05"/><circle cx="12" cy="14.6" r="1.05"/><circle cx="15.4" cy="14.6" r="1.05"/><circle cx="8.6" cy="17.8" r="1.05"/><circle cx="12" cy="17.8" r="1.05"/><circle cx="15.4" cy="17.8" r="1.05"/></g></svg>
    </button>
  </div>

  <div class="display" id="display">
    <div class="line" id="expr"></div>
    <div class="line" id="result">0</div>
  </div>

  <div class="keys">
    <button class="key fn" data-k="backspace" aria-label="刪除">
      <svg viewBox="0 0 28 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M9 1.5h15.5a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H9L1.5 10z"/><path d="M12.5 6l7.5 8M20 6l-7.5 8"/></svg>
    </button>
    <button class="key fn" data-k="clear" id="clearKey">AC</button>
    <button class="key fn" data-k="percent" aria-label="百分比">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><ellipse cx="6.3" cy="5.6" rx="2.6" ry="3.4"/><ellipse cx="17.7" cy="18.4" rx="2.6" ry="3.4"/><path d="M18.5 2.5L5.5 21.5"/></svg>
    </button>
    <button class="key op" data-k="op" data-op="/" aria-label="除">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="10.9" width="20" height="2.2" rx="1.1"/><circle cx="12" cy="4.6" r="1.9"/><circle cx="12" cy="19.4" r="1.9"/></svg>
    </button>

    <button class="key" data-k="num" data-v="7">7</button>
    <button class="key" data-k="num" data-v="8">8</button>
    <button class="key" data-k="num" data-v="9">9</button>
    <button class="key op" data-k="op" data-op="*" aria-label="乘">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M4 4l16 16M20 4L4 20"/></svg>
    </button>

    <button class="key" data-k="num" data-v="4">4</button>
    <button class="key" data-k="num" data-v="5">5</button>
    <button class="key" data-k="num" data-v="6">6</button>
    <button class="key op" data-k="op" data-op="-" aria-label="減">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="10.9" width="20" height="2.2" rx="1.1"/></svg>
    </button>

    <button class="key" data-k="num" data-v="1">1</button>
    <button class="key" data-k="num" data-v="2">2</button>
    <button class="key" data-k="num" data-v="3">3</button>
    <button class="key op" data-k="op" data-op="+" aria-label="加">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="10.9" width="20" height="2.2" rx="1.1"/><rect x="10.9" y="2" width="2.2" height="20" rx="1.1"/></svg>
    </button>

    <button class="key" data-k="sign" aria-label="正負">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5.5 2.5v7M2 6h7M15.5 3L7.5 21.5M14.5 19h7"/></svg>
    </button>
    <button class="key" data-k="num" data-v="0">0</button>
    <button class="key" data-k="dot">.</button>
    <button class="key op" data-k="equals" aria-label="等於">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="7.4" width="18" height="2.2" rx="1.1"/><rect x="3" y="14.4" width="18" height="2.2" rx="1.1"/></svg>
    </button>
  </div>
</div>

<div id="history">
  <div class="sheet">
    <header><button id="histClear">清除</button><span>歷史紀錄</span><button id="histDone">完成</button></header>
    <div id="histList"></div>
  </div>
</div>

<script>
/* ============================================================
   iPhone（iOS 26）風格計算機
   - 主畫面顯示整條算式，按 = 後算式移到上方灰字
   - 先乘除後加減；連按 = 重複上一個運算
   - 顯示區左右滑動刪除一位
   外加魔術功能請用 Calc.hooks（說明在最下面）
   ============================================================ */
const Calc = (() => {
  const MAX_DIGITS = 9;
  const $ = id => document.getElementById(id);
  const resultEl = $('result'), exprEl = $('expr'), displayEl = $('display'), clearKey = $('clearKey');
  const OPSYM = { '+': '+', '-': '−', '*': '×', '/': '÷' };

  let s, history = [];
  function reset() {
    s = { toks: [], done: false, result: 0, doneExpr: '', lastOp: null, lastOperand: null, error: false };
  }
  reset();

  const hooks = {};

  const last = () => s.toks[s.toks.length - 1];
  const isNum = t => t && 'n' in t;
  const prec = op => (op === '*' || op === '/') ? 2 : 1;
  const clean = n => (isFinite(n) ? parseFloat(n.toPrecision(15)) : n);
  const apply = (a, op, b) => op === '+' ? a + b : op === '-' ? a - b : op === '*' ? a * b : (b === 0 ? NaN : a / b);
  const digitCount = str => str.replace(/[^0-9]/g, '').length;

  function evalTokens(toks) {
    toks = [...toks]; if (toks.length && !isNum(toks[toks.length - 1])) toks.pop();
    if (!toks.length) return 0;
    const nums = [], ops = [];
    const reduce = () => { const b = nums.pop(), a = nums.pop(); nums.push(clean(apply(a, ops.pop(), b))); };
    toks.forEach((t, i) => {
      if (isNum(t)) {
        let v = parseFloat(t.n) || 0;
        if (t.pct) {
          const prevOp = toks[i - 1];
          if (prevOp && (prevOp.o === '+' || prevOp.o === '-')) v = clean(evalTokens(toks.slice(0, i - 1)) * v / 100);
          else v = clean(v / 100);
        }
        nums.push(v);
      } else {
        while (ops.length && prec(ops[ops.length - 1]) >= prec(t.o)) reduce();
        ops.push(t.o);
      }
    });
    while (ops.length) reduce();
    return nums[0];
  }

  // ---------- 格式 ----------
  function groupDigits(str) {
    if (str.includes('e')) return str;
    let neg = str.startsWith('-'); if (neg) str = str.slice(1);
    let [i, d] = str.split('.');
    i = i.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '-' : '') + i + (d !== undefined ? '.' + d : '');
  }
  function formatNumber(n) {
    if (!isFinite(n) || isNaN(n)) return '錯誤';
    if (Object.is(n, -0)) return '0';
    const abs = Math.abs(n);
    if (abs !== 0 && (abs >= 1e9 || abs < 1e-8)) {
      let [m, e] = n.toExponential(8).split('e');
      return m.replace(/\.?0+$/, '') + 'e' + parseInt(e, 10);
    }
    const intDigits = abs < 1 ? 1 : Math.floor(Math.log10(abs)) + 1;
    return groupDigits(parseFloat(n.toFixed(Math.max(0, MAX_DIGITS - intDigits))).toString());
  }
  const plain = n => formatNumber(n).replace(/,/g, '');
  const fmtTok = t => isNum(t) ? groupDigits(t.n) + (t.pct ? '%' : '') : OPSYM[t.o];
  const formatExpr = toks => toks.map(fmtTok).join('');

  // ---------- 畫面 ----------
  function render() {
    let big, small;
    if (s.error) { big = '錯誤'; small = s.doneExpr; }
    else if (s.done) { big = formatNumber(s.result); small = s.doneExpr; }
    else { big = s.toks.length ? formatExpr(s.toks) : '0'; small = ''; }
    if (hooks.formatDisplay) {
      const r = hooks.formatDisplay({ big, small }, s);
      if (r) { big = r.big ?? big; small = r.small ?? small; }
    }
    resultEl.textContent = big;
    exprEl.textContent = small;
    clearKey.textContent = (s.toks.length || s.done || s.error) ? 'C' : 'AC';
    fit(resultEl); fit(exprEl);
  }
  function fit(el) {
    el.style.transform = 'none';
    const max = displayEl.clientWidth - 4, w = el.scrollWidth;
    if (w > max) el.style.transform = `scale(${max / w})`;
  }

  // 按 = 之後再按運算子：從結果接著算
  function continueFromResult() {
    const r = s.result; reset(); s.toks = [{ n: plain(r) }];
  }

  // ---------- 按鍵 ----------
  const actions = {
    num(d) {
      if (s.done || s.error) reset();
      const t = last();
      if (isNum(t) && !t.pct) {
        if (digitCount(t.n) >= MAX_DIGITS) return;
        t.n = t.n === '0' ? d : t.n === '-0' ? '-' + d : t.n + d;
      } else if (isNum(t) && t.pct) {
        s.toks.push({ o: '*' }, { n: d });
      } else s.toks.push({ n: d });
    },
    dot() {
      if (s.done || s.error) reset();
      const t = last();
      if (isNum(t) && !t.pct) { if (!t.n.includes('.') && digitCount(t.n) < MAX_DIGITS) t.n += '.'; }
      else if (isNum(t)) s.toks.push({ o: '*' }, { n: '0.' });
      else s.toks.push({ n: '0.' });
    },
    op(op) {
      if (s.error) reset();
      if (s.done) continueFromResult();
      const t = last();
      if (!t) s.toks.push({ n: '0' }, { o: op });
      else if (!isNum(t)) t.o = op;
      else s.toks.push({ o: op });
    },
    equals() {
      if (s.error) { reset(); return; }
      let result, expr;
      if (s.done) {
        if (!s.lastOp) return;
        result = clean(apply(s.result, s.lastOp, s.lastOperand));
        expr = formatNumber(s.result) + OPSYM[s.lastOp] + formatNumber(s.lastOperand);
      } else {
        if (!s.toks.length) return;
        const toks = isNum(last()) ? s.toks : s.toks.slice(0, -1);
        expr = formatExpr(toks);
        result = evalTokens(toks);
        // 記住最後一個運算，供連按 = 使用
        const opIdx = toks.length - 2;
        if (opIdx >= 0) {
          s.lastOp = toks[opIdx].o;
          s.lastOperand = evalTokens([toks[toks.length - 1]]);
        } else s.lastOp = null;
      }
      if (hooks.onEquals) { const r = hooks.onEquals(result, s, expr); if (typeof r === 'number') result = r; }
      s.toks = []; s.done = true; s.doneExpr = expr;
      if (isNaN(result) || !isFinite(result)) { s.error = true; return; }
      s.result = result;
      history.unshift({ e: expr, r: formatNumber(result) });
      if (history.length > 100) history.pop();
    },
    clear() { reset(); },
    percent() {
      if (s.error) return;
      if (s.done) { continueFromResult(); }
      const t = last();
      if (isNum(t) && !t.pct) t.pct = true;
    },
    sign() {
      if (s.error) return;
      if (s.done) { const r = -s.result; reset(); s.toks = [{ n: plain(r) }]; return; }
      const t = last();
      if (isNum(t)) t.n = t.n.startsWith('-') ? t.n.slice(1) : '-' + t.n;
      else s.toks.push({ n: '-0' });
    },
    backspace() {
      if (s.error || s.done) { if (s.error) reset(); return; }
      const t = last();
      if (!t) return;
      if (isNum(t)) {
        if (t.pct) t.pct = false;
        else { t.n = t.n.slice(0, -1); if (t.n === '' || t.n === '-') s.toks.pop(); }
      } else s.toks.pop();
    },
  };

  function press(key, arg) {
    if (hooks.beforeKey && hooks.beforeKey(key, s, arg) === false) { render(); return; }
    actions[key](arg);
    render();
    if (hooks.afterKey) hooks.afterKey(key, s, arg);
  }

  // ---------- 觸控 ----------
  function bindPress(btn, fn) {
    const down = e => { e.preventDefault(); btn.classList.add('pressed'); };
    const up = e => {
      e.preventDefault();
      if (!btn.classList.contains('pressed')) return;
      btn.classList.remove('pressed'); fn();
    };
    const cancel = () => btn.classList.remove('pressed');
    btn.addEventListener('touchstart', down, { passive: false });
    btn.addEventListener('touchend', up, { passive: false });
    btn.addEventListener('touchcancel', cancel);
    btn.addEventListener('mousedown', e => { if (e.button === 0) down(e); });
    btn.addEventListener('mouseup', up);
    btn.addEventListener('mouseleave', cancel);
  }
  document.querySelectorAll('.key').forEach(btn =>
    bindPress(btn, () => press(btn.dataset.k, btn.dataset.k === 'num' ? btn.dataset.v : btn.dataset.op)));

  // 歷史紀錄
  const histEl = $('history'), histList = $('histList');
  function openHistory() {
    histList.innerHTML = history.length ? '' : '<div class="empty">沒有歷史紀錄</div>';
    history.forEach(h => {
      const d = document.createElement('div'); d.className = 'hitem';
      d.innerHTML = `<div class="e"></div><div class="r"></div>`;
      d.querySelector('.e').textContent = h.e; d.querySelector('.r').textContent = h.r;
      d.onclick = () => { reset(); s.toks = [{ n: h.r.replace(/,/g, '') }]; render(); histEl.classList.remove('open'); };
      histList.appendChild(d);
    });
    histEl.classList.add('open');
  }
  bindPress($('histBtn'), () => { if (hooks.onHistoryButton && hooks.onHistoryButton(s) === false) return; openHistory(); });
  bindPress($('modeBtn'), () => { if (hooks.onModeButton) hooks.onModeButton(s); });
  $('histDone').onclick = () => histEl.classList.remove('open');
  $('histClear').onclick = () => { history = []; openHistory(); };
  histEl.addEventListener('click', e => { if (e.target === histEl) histEl.classList.remove('open'); });

  // 顯示區左右滑動 = 刪除一位
  let sx = null;
  displayEl.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
  displayEl.addEventListener('touchend', e => {
    if (sx !== null && Math.abs(e.changedTouches[0].clientX - sx) > 30) press('backspace');
    sx = null;
  });

  // 電腦鍵盤（測試用）
  document.addEventListener('keydown', e => {
    const k = e.key;
    if (/^[0-9]$/.test(k)) press('num', k);
    else if (k === '.') press('dot');
    else if ('+-*/'.includes(k) && k.length === 1) press('op', k);
    else if (k === 'Enter' || k === '=') press('equals');
    else if (k === 'Backspace') press('backspace');
    else if (k === 'Escape') press('clear');
    else if (k === '%') press('percent');
  });

  window.addEventListener('resize', render);
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());
  render();

  return {
    hooks, press, render,
    get state() { return s; },
    get history() { return history; },
    reset: () => { reset(); render(); },
  };
})();

/* ---------- 加魔術功能用的 hooks ----------
  Calc.hooks.beforeKey = (key, state, arg) => { ... return false 可攔截 }
  Calc.hooks.afterKey  = (key, state, arg) => { ... }
  Calc.hooks.onEquals  = (result, state, expr) => { return 新數字 可替換結果 }
  Calc.hooks.formatDisplay = ({big, small}, state) => ({ big, small })
  Calc.hooks.onModeButton  = (state) => { 右上角計算機鈕，可當秘密開關 }
  Calc.hooks.onHistoryButton = (state) => { return false 可不開歷史紀錄 }
*/

// 離線可用（裝到主畫面後沒網路也能開）
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
}
</script>
</body>
</html>
